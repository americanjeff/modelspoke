# Transitive dev-only deps (pi-ai → @google/genai → protobufjs); type-only
# use, their install scripts are not needed.
allowBuilds:
  '@google/genai': false
  protobufjs: false

# (The 0.1.2-rc.1-era `overrides` block that forced the whole dsh family to
# one consistent set is gone: the 0.1.5-rc.2 set is published with
# self-consistent peer ranges (^0.1.5-rc.2), which is the condition the
# block's header asked to be dropped.)
