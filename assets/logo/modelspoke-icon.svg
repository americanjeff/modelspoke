<!--
  ModelSpoke icon — "Bubble Wheel, hollow hub" (owner-selected 2026-08-26,
  wordmark font: IBM Plex Sans, semibold).

  Source: research/logo-spike (candidates/bubble-wheel-hollow.svg is the raw
  candidate; this is the same geometry, grouped + annotated for editing).

  How to play with it:
  - 64x64 viewBox; everything is stroked with `currentColor`, so the mark
    inherits whatever color its container gives it. Render at any size.
  - The two knobs that define the mark:
      stroke-width 6  (outer shell + spokes — the "weight" of the mark)
      hub stroke-width 3 + r 4.5  (the hollow bearing ring; keep the gap
        between hub outer edge (r 6) and the spoke inner ends readable, or
        the hub collapses to a blob below ~16px)
  - Groups: #bubble (shell), #spokes (three, at ~120° with a 30° tilt so
    the wheel reads as rotating), #tail (the filled speech-bubble tail),
    #hub (hollow ring).
-->

<!-- Bounding-box fix (orchestrator 2026-08-26): the three -42° rotations
     pivoted the composition into the lower-right corner, so the full-opacity
     mark overflowed the original 64x64 box by 7.75 units at the bottom (and
     0.5 at the right). Content bbox measured from the render:
     x 1.0..64.5, y 11.25..71.75. Viewbox expanded to a centered square
     (71.5x71.5, ~4-5.5 units margin); the artwork is untouched. -->
