<!--
  ModelSpoke icon — "Bubble Wheel, hollow hub", depth variant,
  SOFT RECT PANEL (final README header logo, settled 2026-08-26).

  Spec (owner decisions across the iteration):
  - background: BLACK at 50% peak opacity — reads as a gentle gray field
    on GitHub light and as a subtle darkening on GitHub dark (#0d1117),
    so the white mark keeps contrast in BOTH themes
  - shape: RECTANGLE, not a radial pool — a circular pool's edge read as
    a competing shape against the wheel (owner: "the boundary of the
    background color should not contribute to the presentation of
    shapes"); straight soft edges ~18u from the art read as a panel, not
    a shape
  - edge: 7u ease-out ramp to alpha 0 (16 subpixel rings, fill-rule
    evenodd) — no filters: filters don't render in every SVG-as-image
    pipeline (GitHub's rasterizer included); rings do
  - centering: the OPAQUE (main) copy is centered on the 100-unit box —
    the 11%/33% depth echoes trail upper-left. translate(9.44,-2.62) is
    the re-centering from the composition-bbox centering.
  - mark: white, groups byte-identical to bubble-wheel-hollow-3-white.svg
    (opacities 1.0/0.33/0.11; depth knobs — stroke 6 outer, hub stroke 3
    r 4.5 — in that file's header).

  Geometry: 100x100 viewBox (the 71.5 predecessor couldn't hold the mark
  inside a seam-free fade — the tail reaches 43.85u from center vs a
  35.75u inscribed circle). Composition bbox now spans x 10.4..73.9,
  y 8.6..69.1 — fully inside the solid core (inset 7u).

  Usage: <img ... width="88" height="88"> in the README (restores the
  mark to its pre-tile on-page size).

  Iteration history (all superseded): white-on-transparent (invisible on
  light); radial pool 1.0 (circular edge + soft tail edge — the tail sat
  in the fade); radial pool 0.9/0.95 stops (crisper circle = worse);
  50% radial (right darkness, wrong shape); white panel + white mark
  (cancels on light); white panel + dark mark (works, but owner settled
  on the light mark).

  Siblings: bubble-wheel-hollow.svg (single currentColor),
  bubble-wheel-hollow-3.svg (depth currentColor),
  bubble-wheel-hollow-3-white.svg (depth white-on-transparent).
-->
